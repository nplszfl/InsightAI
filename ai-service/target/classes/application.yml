spring:
  application:
    name: insightai-ai-service

server:
  port: 8080

deepseek:
  api:
    url: https://api.deepseek.com/v1
    model: deepseek-chat
    api-key: ${DEEPSEEK_API_KEY:}
    timeout: 60000
    max-retries: 3
    retry-delay: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always